# One completed simulation run returns one score and supplies one turn.
# Credit, template-derived yield estimation, and continuation are separate.

[persistence]
position_scale = 0.1
velocity_scale = 0.1
relative_period_scale = 0.1
phase_samples = 128

[study]
a = 0.15
sigma = 0.03
horizon = 125.66370614359172


[physics]
modulation_frequency = 0.7
rotating_amplitude = 0.02
rotating_frequency = 0.4

[forcing]
seed = 20261006
grid_step = 0.1
ar_decay = 0.2

[numerics]
method = "DOP853"
max_step = 0.05
rtol = 1e-7
atol = 1e-9
sample_step = 0.02

[episodes.spaceship_trajectory_search]
continuation_cost = 0.02

[episodes.spaceship_trajectory_search.yield]
window_size = 8
subsample_size = 4
uncertainty_alpha = 0.05

[episodes.mathematical_exploration]
continuation_cost = 0.04

[episodes.mathematical_exploration.yield]
window_size = 8
subsample_size = 4
uncertainty_alpha = 0.05

[episodes.simulation_investigation]
continuation_cost = 0.04

[episodes.simulation_investigation.yield]
window_size = 8
subsample_size = 4
uncertainty_alpha = 0.05

[episodes.simparts]
continuation_cost = 0.04

[episodes.simparts.yield]
window_size = 8
subsample_size = 4
uncertainty_alpha = 0.05

[models.connection]
command = ["codex", "app-server", "--stdio"]

[models.FAST]
model = "gpt-6-luna"
reasoning_effort = "none"

[models.REASONING]
model = "gpt-6-sol"
reasoning_effort = "medium"

[models.routing]
decide = "REASONING"
human_report = "FAST"

[scenario]
id = "scenario_02"
name = "Circular binary gravitational attractors"
initial_position = [1.0, 0.0]
reference_velocity = [0.0, 1.0]
radial_limits = [0.0, 4.0]

[scenario.gravity]
kind = "circular_binary"
masses = [0.75, 0.25]
separation = 0.8
phase = 0.0
collision_radii = [0.05, 0.035]
